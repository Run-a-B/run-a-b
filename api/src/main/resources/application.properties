spring.application.name=api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/runab_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration-ms=86400000
jwt.temp-token-expiration-ms=600000



google.client-id=${GOOGLE_CLIENT_ID:}

# Gmail SMTP (optional for local development)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
app.trusted-proxy-ips=${TRUSTED_PROXY_IPS:}

# bizinfo OpenAPI (기업마당 정책 동기화)
bizinfo.api.url=https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
bizinfo.api.key=${BIZINFO_API_KEY:}

# AI Gateway (RunPod) 연동 - DEPRECATED, OpenAI로 대체됨 (2026.07.01). 코드는 남겨두되 호출 안 함.
ai.gateway.base-url=${AI_GATEWAY_BASE_URL:https://unused.invalid}
ai.gateway.api-key=${RUNAB_AI_API_KEY:unused}
ai.gateway.timeout-seconds=180

# OpenAI 연동 (정책 AI 리포트 생성)
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.timeout-seconds=60

spring.jackson.serialization.write-dates-as-timestamps=false
