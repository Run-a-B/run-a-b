name: Create one ordinary production demo account
on:
  push:
    branches: [codex/ec2-preflight-20261019]
    paths: ['.github/workflows/create-demo.yml']
permissions:
  contents: read
concurrency:
  group: runab-production
  cancel-in-progress: false
jobs:
  create-demo:
    if: github.ref == 'refs/heads/codex/ec2-preflight-20261019' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass
      - name: Insert only the synthetic demo identity
        env:
          SSHPASS: ${{ secrets.EC2_PASSWORD }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DEMO_PASSWORD_HASH: ${{ secrets.RUNAB_DEMO_HASH_20261019 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/codex/ec2-preflight-20261019 ]] || exit 1
          : "${SSHPASS:?EC2 password is required}"
          : "${EC2_KNOWN_HOSTS:?Pinned host is required}"
          : "${DEMO_PASSWORD_HASH:?One-shot demo hash is required}"
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F 43.201.103.134 -f "$HOME/.ssh/known_hosts" > /dev/null
          python3 - <<'PY'
          import base64, os, re, subprocess, sys
          try:
              password_hash = os.environ['DEMO_PASSWORD_HASH']
              assert re.fullmatch(r'\$2[aby]\$12\$[./A-Za-z0-9]{53}', password_hash)
              source = base64.b64decode('').decode()
              source += '\nmain(' + repr(password_hash) + ')\n'
              result = subprocess.run(['sshpass', '-e', 'ssh', '-T',
                  '-o', 'StrictHostKeyChecking=yes', '-o', 'GlobalKnownHostsFile=/dev/null',
                  '-o', 'UserKnownHostsFile=' + os.environ['HOME'] + '/.ssh/known_hosts',
                  '-o', 'ConnectTimeout=15', '-o', 'NumberOfPasswordPrompts=1',
                  '--', 'ec2-user@43.201.103.134', 'sudo', '-n', 'python3', '-I', '-'],
                  input=source, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=90)
              assert result.returncode == 0
              import json
              status = json.loads(result.stdout)
              assert status == {'created': True, 'ordinary_account': True, 'fictional_business_profile': True}
              print(json.dumps(status))
          except BaseException:
              print('ERROR: creation not confirmed; do not reset an existing identity', file=sys.stderr)
              sys.exit(1)
          PY
