name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Test and build API
        working-directory: api
        run: bash ./gradlew --no-daemon test bootJar
      - name: Test deployment operations and workflow boundaries
        run: python3 -m unittest discover -s ops/ec2 -p 'test_*.py' -v
