services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: runab_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mysql}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - runab_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  runab_mysql_data:
